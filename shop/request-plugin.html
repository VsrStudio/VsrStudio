<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Plugin - VsrStudio</title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        /* Navbar */
        .navbar {
            background: #222;
            padding: 15px 0;
            text-align: center;
        }

        .navbar .container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .navbar-brand {
            color: white;
            font-size: 22px;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar-toggle {
            display: none;
            background: none;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .navbar-nav {
            list-style: none;
            display: flex;
        }

        .navbar-nav li {
            margin: 0 10px;
        }

        .navbar-nav .nav-link {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            transition: 0.3s;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .active {
            background: #ff9800;
            border-radius: 5px;
        }

        /* Form Section */
        .request-plugin {
            background: white;
            padding: 40px 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .request-plugin h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .request-plugin p {
            text-align: center;
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        form textarea {
            height: 100px;
            resize: vertical;
        }

        .btn-request {
            background: #ff9800;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-request:hover {
            background: #e68900;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 30px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar .container {
                flex-direction: column;
            }

            .navbar-nav {
                display: none;
                flex-direction: column;
                width: 100%;
                text-align: center;
                background: #222;
            }

            .navbar-nav.active {
                display: flex;
            }

            .navbar-nav li {
                margin: 10px 0;
            }

            .navbar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="#" class="navbar-brand">VsrStudio</a>
            <button class="navbar-toggle" onclick="toggleMenu()">☰</button>
            <ul class="navbar-nav" id="menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="request-plugin.html" class="nav-link active">Request Plugin</a></li>
                <li><a href="shop.html" class="nav-link">Shop</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Form Request Plugin -->
    <section class="request-plugin">
        <h2>Request Plugin</h2>
        <p>Silakan isi formulir berikut untuk memesan plugin custom</p>
        
        <form id="pluginForm">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" placeholder="Masukkan nama Anda" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email Anda" required>

            <label for="pluginType">Jenis Plugin</label>
            <select id="pluginType">
                <option value="minigame">Minigame</option>
                <option value="economy">Ekonomi</option>
                <option value="cosmetic">Kosmetik</option>
                <option value="other">Lainnya</option>
            </select>

            <label for="description">Deskripsi Plugin</label>
            <textarea id="description" placeholder="Jelaskan fitur yang diinginkan" required></textarea>

            <label for="budget">Anggaran (Rp)</label>
            <input type="number" id="budget" placeholder="Masukkan anggaran Anda" required>

            <button type="submit" class="btn-request">Kirim Request</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 VsrStudio - All Rights Reserved</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function toggleMenu() {
            var menu = document.getElementById("menu");
            menu.classList.toggle("active");
        }

        document.getElementById("pluginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var pluginType = document.getElementById("pluginType").value;
            var description = document.getElementById("description").value;
            var budget = document.getElementById("budget").value;

            // Format pesan untuk WhatsApp
            var message = `Halo, saya ingin memesan plugin custom:\n\nNama: ${name}\nEmail: ${email}\nJenis Plugin: ${pluginType}\nDeskripsi: ${description}\nAnggaran: Rp${budget}\n\nTolong berikan informasi lebih lanjut.`;
            var waUrl = "https://wa.me/6285711051518?text=" + encodeURIComponent(message);

            // Redirect ke WhatsApp
            window.location.href = waUrl;
        });
    </script>

</body>
</html>
